laravel: '@testbench'

# Sin credenciales aqui: este fichero va al repositorio. Se pasan al arrancar.
#   REDSYS_MERCHANT_CODE=... REDSYS_TERMINAL=... REDSYS_SECRET_KEY=... \
#     vendor/bin/testbench serve

providers:
  - Workbench\App\Providers\WorkbenchServiceProvider
  - MarioDevv\RedsysSubscriptions\RedsysSubscriptionsServiceProvider

workbench:
  start: '/'
  install: true
  health: false
  discovers:
    web: true
    commands: true
    views: true
  build:
    - create-sqlite-db
    - db-wipe
    - migrate-fresh
